name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Lint
        run: uvx ruff check --select F,E9 microtopos tests
      - name: Type checking (MyPy)
        run: uv run --python 3.12 --group dev mypy microtopos/logging.py microtopos/validation.py microtopos/mosaic.py
      - name: Tests (ground-truth self-tests, scientific regressions and offscreen GUI smoke test)
        run: uv run --python 3.12 --group dev pytest -q
