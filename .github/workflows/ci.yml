name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - {os: ubuntu-24.04, python: "3.13"}  # Python 3.11 aborts in the Qt bindings (refcount bug), so 3.12 is the minimum
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no moving major tag is published)
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Lint
        run: uvx ruff check --select F,E9 microtopos tests
      - name: Tests (ground-truth self-tests + offscreen GUI smoke test + generalisation subset)
        run: uv run --python ${{ matrix.python }} --group dev pytest -q

  generalization:
    # the full seeds x objectives x conditions matrix (pytest -m slow); one job, in parallel with the test matrix
    name: generalisation matrix (slow, ubuntu-24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no moving major tag is published)
      - name: Qt runtime libraries (collection imports every test module)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Full generalisation matrix
        run: uv run --python 3.12 --group dev pytest -q -m slow
