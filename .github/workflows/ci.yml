name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # a guard against a hung job, not a speed target: the same suite takes 21-40+ min on the hosted macOS and
    # Windows runners depending on the machine (2026-11-27), so 40 cancelled healthy runs; with the v0.11 GUI tests
    # macOS took 56 min and Windows was cancelled at 60 after 59.5 min of tests (2026-11-28)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - {os: ubuntu-24.04, python: "3.13"}  # Python 3.11 aborts in the Qt bindings (refcount bug), so 3.12 is the minimum
    env:
      QT_QPA_PLATFORM: offscreen
      # a skip whose reason is not in the allowlist of tests/conftest.py fails the build (see AGENTS.md)
      MICROTOPOS_STRICT_SKIPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no moving major tag is published)
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Lint (project configuration, the ruff version pinned in uv.lock)
        run: uv run --python ${{ matrix.python }} --group dev ruff check microtopos tests tools
      - name: Tests (ground-truth self-tests + offscreen GUI tests + generalisation subset; -rs lists every skip)
        run: uv run --python ${{ matrix.python }} --group dev pytest -q -rs

  tests-bite:
    # every test a pull request adds or changes must fail on the base branch, or say why it does not (AGENTS.md)
    name: new tests fail on the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base branch's package is checked out next to the change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no moving major tag is published)
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: New or changed tests against the base branch's package
        run: uv run --python 3.12 --group dev python tools/tests_bite.py --base "origin/$BASE_REF"

  generalization:
    # the full seeds x objectives x conditions matrix (pytest -m slow); one job, in parallel with the test matrix
    name: generalisation matrix (slow, ubuntu-24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MICROTOPOS_STRICT_SKIPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no moving major tag is published)
      - name: Qt runtime libraries (collection imports every test module)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Full generalisation matrix
        run: uv run --python 3.12 --group dev pytest -q -rs -m slow
