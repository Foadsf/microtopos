name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, os: ubuntu-22.04}  # oldest supported glibc -> runs on most distributions
          - {target: linux-arm64, os: ubuntu-24.04-arm}  # PySide6 arm64 wheels need glibc 2.39
          - {target: windows-x86_64, os: windows-latest}
          - {target: macos-arm64, os: macos-14}
          - {target: macos-x86_64, os: macos-15-intel}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no moving major tag is published)
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-util1
      - name: Build portable executable
        id: build
        shell: bash
        run: |
          uv sync --python 3.12
          uv run --with "pyinstaller==6.22.3" python packaging/build.py | tee build.out
          echo "exe=$(grep '^EXE=' build.out | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: The executable tests itself (ground-truth checks + offscreen GUI)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "${{ steps.build.outputs.exe }}" --version
          "${{ steps.build.outputs.exe }}" --selftest --quick --gui --json "$GITHUB_WORKSPACE/release/selftest-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: microtopos-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "MicroTopos ${{ github.ref_name }}" --generate-notes
